trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

steps:
  - task: UseDotNet@2
    displayName: Use .NET 8 SDK
    inputs:
      packageType: sdk
      version: 8.x

  - script: dotnet restore ContosoPay.sln
    displayName: Restore solution

  - script: dotnet build ContosoPay.sln --configuration $(buildConfiguration) --no-restore
    displayName: Build solution

  - script: dotnet test ContosoPay.sln --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults
    displayName: Run tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: $(Agent.TempDirectory)/TestResults
      failTaskOnFailedTests: true